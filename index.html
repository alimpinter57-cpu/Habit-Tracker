<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habitly – Habit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4fb;--card:#fff;--ink:#1b1a2b;--mut:#8a87a1;--line:#eceaf6;--acc:#6c5ce7;--acc2:#a78bfa;--ok:#22c55e;--bad:#f43f5e;--chip:#efedf9;--sh:0 6px 24px -10px rgba(60,40,140,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100f1a;--card:#1b1a2a;--ink:#f1effc;--mut:#9795b0;--line:#2a2840;--chip:#262439;--sh:0 6px 24px -10px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#100f1a;--card:#1b1a2a;--ink:#f1effc;--mut:#9795b0;--line:#2a2840;--chip:#262439;--sh:0 6px 24px -10px rgba(0,0,0,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:radial-gradient(120% 40% at 50% 0,color-mix(in srgb,var(--acc) 16%,transparent),transparent)}
main{flex:1;overflow-y:auto;padding:22px 20px 28px;scrollbar-width:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .12s;touch-action:manipulation}
button:active{transform:scale(.96)}
h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.8px;line-height:1.15}
h2{font-size:17px;margin:22px 0 12px;font-weight:800}
.mut{color:var(--mut);font-size:13px;font-weight:500}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.row{display:flex;align-items:center;gap:14px}.grow{flex:1;min-width:0}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:28px;padding:22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 18px 36px -16px var(--acc);margin:6px 0 20px}
.hero .mut{color:#ffffffcc}.hero b{font-size:22px;font-weight:800;display:block;margin:4px 0 2px;letter-spacing:-.4px}
.week{display:flex;gap:8px;margin-bottom:18px}
.wd{flex:1;padding:10px 0;border-radius:18px;background:var(--card);box-shadow:var(--sh);text-align:center;font-size:11px;font-weight:600;color:var(--mut)}
.wd b{display:block;font-size:17px;font-weight:800;color:var(--ink);margin-top:3px}
.wd.on{background:var(--ink);color:var(--bg)}.wd.on b{color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none}
.chip{background:var(--card);box-shadow:var(--sh);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap;flex:none;color:var(--mut)}
.chip.on{background:var(--acc);color:#fff}
.ico{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:25px;flex:none}
.name{font-weight:700;font-size:15.5px}
.chk{width:42px;height:42px;border-radius:50%;border:2.5px solid;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex:none}
.dots{width:36px;height:36px;border-radius:12px;font-size:20px;color:var(--mut)}
.btn{padding:14px;border-radius:16px;background:var(--chip);font-weight:700;font-size:14px;width:100%;text-align:center}
.btn.p{background:var(--acc);color:#fff;box-shadow:0 10px 22px -10px var(--acc)}.btn.danger{color:var(--bad)}
.add{width:100%;padding:17px;border-radius:20px;background:var(--ink);color:var(--bg);font-weight:800;font-size:15px;margin-top:4px}
nav{display:flex;margin:0 18px 14px;padding:8px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;box-shadow:0 14px 34px -12px rgba(40,30,100,.35);border:1px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut);padding:9px 4px;border-radius:19px}
nav button.on{background:var(--acc);color:#fff}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input[type=text],input[type=email],textarea{width:100%;padding:16px;border-radius:18px;border:2px solid transparent;background:var(--card);box-shadow:var(--sh);color:var(--ink);font:inherit;font-size:15.5px;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
.l{display:block;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin:24px 0 10px}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.g{width:48px;height:48px;border-radius:16px;background:var(--card);box-shadow:var(--sh);font-size:23px;border:2.5px solid transparent}
.g.on{border-color:var(--acc)}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px transparent}.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.seg{display:flex;background:var(--chip);border-radius:18px;padding:5px}
.seg button{flex:1;padding:12px 4px;border-radius:14px;font-size:13px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.cal i{font-style:normal;text-align:center;font-size:10.5px;color:var(--mut);font-weight:700}
.d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--chip);color:var(--mut)}
.d.ok{background:var(--ok);color:#fff}.d.no{background:var(--bad);color:#fff}.d.off{opacity:.4}.d.td{box-shadow:inset 0 0 0 2px var(--acc);color:var(--ink)}.d.nx{opacity:.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--chip);border-radius:16px;padding:12px 6px;text-align:center}
.st b{display:block;font-size:21px;font-weight:800}.st span{font-size:10.5px;color:var(--mut);font-weight:600;line-height:1.3;display:block;margin-top:2px}
.empty{text-align:center;padding:46px 20px;color:var(--mut);font-size:14px}.empty big{font-size:44px;display:block;margin-bottom:8px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.back{width:42px;height:42px;border-radius:15px;background:var(--card);box-shadow:var(--sh);font-size:18px;font-weight:700}
.sheetbg{cursor:pointer;position:absolute;inset:0;background:rgba(10,8,30,.45);display:flex;align-items:flex-end;z-index:20;animation:f .18s}
.sheet{width:100%;background:var(--card);border-radius:28px 28px 0 0;padding:12px 20px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;animation:u .22s}
.sheet .bar{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 8px}
.toast{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:30;animation:f .2s;white-space:nowrap}
.d.mini{background:color-mix(in srgb,var(--ok) 50%,var(--chip));color:#fff}.d.fz{background:#bfdbfe;color:#1e40af}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;font-size:12.5px;font-weight:700;background:#ffffff26;color:#fff;margin-top:12px}
.mb{display:block;font-size:12px;font-weight:700;color:var(--acc);margin-top:6px;text-align:left}
.tag{font-size:11.5px;font-weight:700;color:var(--acc);margin-top:3px}
.ins{background:linear-gradient(135deg,#0ea5e9,var(--acc));color:#fff}.ins .mut{color:#ffffffcc}
textarea.big{min-height:46vh;resize:none;line-height:1.55}
.nb{background:var(--chip);border-radius:14px;padding:12px;font-size:13px;white-space:pre-wrap;color:var(--mut)}
textarea{resize:none}.mb.nt{color:var(--mut);font-weight:600;line-height:1.4}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(40px)}}
</style>
</head>
<body>
<div id="app"><main id="main"></main><nav id="nav"></nav><div id="ov"></div></div>
<script>
const ICONS=['💧','📖','🏃','🧘','💪','🥗','😴','✍️','🎧','🧹','💊','🌱','🎯','☕','🚭','💻'];
const COLORS=['#6c5ce7','#ec4899','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#a855f7'];
const REP={day:'Harian',week:'Mingguan',month:'Bulanan',year:'Tahunan'};
const MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DAYS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const NAV={today:['Today','<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],sum:['Ringkasan','<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],notes:['Notes','<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/>'],me:['Me','<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>']};
const K=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const now=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;

function seed(){const t=now(),log=p=>{const o={};for(let i=1;i<=40;i++)if(Math.random()<p)o[K(addD(t,-i))]='done';return o};
  const wk={};for(let i=1;i<=40;i++){const x=addD(t,-i);if(x.getDay()===t.getDay()&&i%14)wk[K(x)]='done'}
  return{cats:['Kesehatan','Produktif'],user:null,habits:[
    {id:1,name:'Minum air 2 liter',icon:'💧',color:'#06b6d4',repeat:'day',cat:'Kesehatan',start:K(addD(t,-40)),log:log(.8)},
    {id:2,name:'Baca buku 20 menit',icon:'📖',color:'#6c5ce7',repeat:'day',cat:'Produktif',start:K(addD(t,-40)),log:log(.6)},
    {id:3,name:'Olahraga',icon:'🏃',color:'#f97316',repeat:'week',cat:'Kesehatan',start:K(addD(t,-40)),log:wk}]}}
function load(){try{const r=localStorage.getItem('habitly_v1');return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem('habitly_v1',JSON.stringify(dump()))}catch(e){}}
S=Object.assign({notes:[],freezes:{},reviews:{}},load()||seed(),{tab:'today',cat:'Semua',sel:K(now()),sheet:null,form:null,nf:null,mo:0,ex:{},cdc:null});save();

function sched(h,d){const s=P(h.start);if(d<s)return false;
  if(h.repeat==='day')return true;
  if(h.repeat==='week')return d.getDay()===s.getDay();
  if(h.repeat==='month')return d.getDate()===s.getDate();
  return d.getDate()===s.getDate()&&d.getMonth()===s.getMonth()}

/* BUG-001: streak tidak putus oleh hari ini yang belum dicentang & hari libur */
function stats(h){const t=now(),tk=K(t),s=P(h.start);let streak=0,run=true,elig=0,done=0;
  for(let d=new Date(t);d>=s;d=addD(d,-1)){
    if(!sched(h,d))continue;const k=K(d),v=val(h,k);
    if(v==='off')continue;                       // libur: dilewati, tidak memutus & tidak dihitung
    if(isDone(v)){done++;elig++;if(run)streak++;continue}
    if(k===tk)continue;                          // hari ini belum selesai: belum dianggap gagal
    elig++;run=false}                            // hari terjadwal terlewat: streak putus
  let ms=0,md=0;
  for(let d=new Date(t.getFullYear(),t.getMonth(),1);d<=t;d=addD(d,1)){
    if(!sched(h,d))continue;const k=K(d),v=val(h,k);
    if(v==='off'||(!v&&k===tk))continue;ms++;if(isDone(v))md++}
  return{streak,streakPct:elig?Math.round(streak/elig*100):0,cr:elig?Math.round(done/elig*100):0,fin:ms?Math.round(md/ms*100):0}}

function dump(){return{cats:S.cats,habits:S.habits,user:S.user,notes:S.notes,freezes:S.freezes,reviews:S.reviews}}
function isDone(v){return v==='done'||v==='mini'}
function val(h,k){const v=h.log[k];return v||(S.freezes[k]?'off':v)}
function fmtDate(k){const d=P(k);return d.getDate()+' '+MON[d.getMonth()].slice(0,3)+' '+d.getFullYear()}
function wkStats(a,b){const t=now();let tot=0,dn=0;const per=[];
  S.habits.forEach(h=>{let n=0,c=0;
    for(let i=a;i<=b;i++){const d=addD(t,-i);if(!sched(h,d))continue;const v=val(h,K(d));if(v==='off'||(!v&&i===0))continue;n++;if(isDone(v))c++}
    tot+=n;dn+=c;if(n)per.push({h,p:Math.round(c/n*100)})});
  return{tot,dn,per,pct:tot?Math.round(dn/tot*100):0}}
function freezeLeft(){const m=S.sel.slice(0,7),used=Object.keys(S.freezes).filter(k=>k.startsWith(m)).length;
  return Math.max(0,3-used)}
function nudge(h){const nx=S.habits.find(x=>x.stack&&x.stack.toLowerCase()===h.name.toLowerCase()&&!isDone(x.log[S.sel])&&sched(x,P(S.sel)));
  if(nx)setTimeout(()=>toast('🔗 Selanjutnya: '+nx.name),1900)}
function stamp(h,k){if(k!==K(now()))return;(h.times=h.times||{})[k]=new Date().getHours()}
function wkKey(){const t=now();return K(addD(t,-((t.getDay()+6)%7)))}
function noteCount(){const t=now(),from=addD(t,-6);let total=0,best={h:null,n:0};
  S.habits.forEach(h=>{const n=Object.keys(h.notes||{}).filter(k=>P(k)>=from&&P(k)<=t).length;total+=n;if(n>best.n)best={h,n}});
  return{...best,total}}
function insights(){const t=now(),out=[];
  S.habits.forEach(a=>S.habits.forEach(b=>{if(a.id>=b.id)return;let ad=0,an=0,bd=0,bn=0;
    for(let i=0;i<28;i++){const d=addD(t,-i),k=K(d);if(!sched(a,d)||!sched(b,d))continue;const va=val(a,k),vb=val(b,k);
      if(va==='off'||vb==='off'||(i===0&&!va))continue;
      if(isDone(va)){ad++;if(isDone(vb))bd++}else{an++;if(isDone(vb))bn++}}
    if(ad<5||an<5)return;const p1=Math.round(bd/ad*100),p0=Math.round(bn/an*100);
    if(p1-p0>=15)out.push({gap:p1-p0,text:`🔍 Pola menarik: dalam 28 hari terakhir, saat kamu menyelesaikan “${a.name}”, “${b.name}” ikut selesai ${p1}% (vs ${p0}% di hari lain), selisih ${p1-p0} poin. Pertahankan!`})}));
  patterns(out);
  return out.sort((x,y)=>y.gap-x.gap).slice(0,3)}
function patterns(out){const t=now(),wd=Array.from({length:7},()=>({n:0,c:0})),day=[];
  for(let i=0;i<56;i++){const d=addD(t,-i),k=K(d);let n=0,c=0,am=false,pm=false;
    S.habits.forEach(h=>{if(!sched(h,d))return;const v=val(h,k);if(v==='off'||(!v&&i===0))return;n++;
      if(isDone(v)){c++;const hr=h.times&&h.times[k];if(hr!=null){if(hr<12)am=true;else pm=true}}});
    if(!n)continue;wd[d.getDay()].n+=n;wd[d.getDay()].c+=c;if(am||pm)day.push({r:c/n,am})}
  const tn=wd.reduce((a,x)=>a+x.n,0),avg=tn?Math.round(wd.reduce((a,x)=>a+x.c,0)/tn*100):0;
  const rk=wd.map((x,i)=>({i,n:x.n,p:x.n?Math.round(x.c/x.n*100):0})).filter(x=>x.n>=6).sort((a,b)=>b.p-a.p);
  if(rk.length>1){const hi=rk[0],lo=rk[rk.length-1];
    if(hi.p-avg>=10)out.push({gap:hi.p-avg,text:`🔍 Pola: Konsistensi kamu paling tinggi di hari ${DAYS[hi.i]} (${hi.p}%, ${hi.p-avg} poin di atas rata-rata). Manfaatkan hari itu untuk kebiasaan yang paling sulit!`});
    if(avg-lo.p>=15)out.push({gap:avg-lo.p,text:`🔍 Pola: Hari ${DAYS[lo.i]} paling sering terlewat (${lo.p}%). Coba siapkan versi mini untuk hari itu.`})}
  const A=day.filter(x=>x.am),B=day.filter(x=>!x.am);
  if(A.length>=4&&B.length>=4){const m=a=>a.reduce((q,x)=>q+x.r,0)/a.length,df=Math.round((m(A)-m(B))*100);
    if(df>=10)out.push({gap:df,text:`🔍 Pola: Konsistensi kamu meningkat ${df}% pada hari saat kamu menyelesaikan kebiasaan di pagi hari!`})}}
function weekCard(){const w=wkStats(0,6),t=now(),nc=noteCount(),wk=wkKey();
  const ss=S.habits.map(h=>stats(h).streak),act=ss.filter(x=>x>0).length,sum=ss.reduce((a,b)=>a+b,0);
  return`<div class='card'><div class='name'>📅 Weekly Review</div><div class='mut'>${fmtDate(K(addD(t,-6)))} – ${fmtDate(K(t))}</div>
  <div class='stats' style='margin-top:12px'><div class='st'><b style='color:var(--ok)'>${w.pct}%</b><span>Kebiasaan selesai<br>${w.dn} dari ${w.tot}</span></div><div class='st'><b style='color:var(--acc)'>${act}</b><span>Streak aktif<br>total ${sum} hari</span></div><div class='st'><b style='color:#f97316'>${nc.total}</b><span>Catatan<br>minggu ini</span></div></div>
  <div class='mut' style='margin:12px 0 0'>${nc.h?'📝 Paling sering dicatat: '+esc(nc.h.name)+' ('+nc.n+'x)':'📝 Belum ada catatan minggu ini. Tulis refleksi singkat pada kebiasaan yang selesai.'}</div>
  <label class='l' style='margin:16px 0 8px'>Refleksi minggu ini</label>
  <textarea id='wrtext' data-wk='${wk}' rows='4' placeholder='Apa yang berjalan baik? Apa yang bisa diperbaiki?'>${esc(S.reviews[wk]||'')}</textarea>
  <button class='btn' style='margin-top:10px' data-a='wr'>Simpan ke Notes</button></div>`}
function catCard(){
  return`<div class='card'><div class='name'>🏷️ Kategori</div><div class='mut' style='margin:4px 0 8px'>Tambah atau hapus kategori kebiasaan.</div>
  ${S.cats.length?S.cats.map(c=>{const n=S.habits.filter(h=>h.cat===c).length,ask=S.cdc===c;
    return`<div class='row' style='padding:10px 0;border-top:1px solid var(--line)'><div class='grow'><div class='name' style='font-size:14px'>${esc(c)}</div><div class='mut'>${n?n+' kebiasaan':'Tidak dipakai'}${ask?' · akan dipindah ke Tanpa kategori':''}</div></div><button class='btn danger' style='width:auto;padding:9px 14px' data-a='catdel' data-v='${esc(c)}'>${ask?'Yakin?':'Hapus'}</button></div>`}).join(''):`<div class='mut'>Belum ada kategori.</div>`}
  <div class='row' style='margin-top:12px;gap:8px'><input type='text' id='catnew' placeholder='Kategori baru' maxlength='24'><button class='btn p' style='width:auto;padding:14px 18px' data-a='catadd'>Tambah</button></div></div>`}
function qnSheet(){const h=S.habits.find(x=>x.id===S.qid);if(!h)return'';
  return`<div class='sheetbg' data-a='close'><div class='sheet'><div class='bar'></div>
  <div class='row'><div class='ico' style='background:${h.color}26'>${h.icon}</div><div><div class='name'>${esc(h.name)}</div><div class='mut'>Catatan · ${fmtDate(S.sel)}</div></div></div>
  <textarea id='qntext' rows='4' maxlength='300' placeholder='mis. Bahu kiri agak pegal saat workout'>${esc((h.notes&&h.notes[S.sel])||'')}</textarea>
  <button class='btn p' data-a='qnsave'>Simpan catatan</button></div></div>`}
function insCard(){const l=insights();
  return`<div class='card ins'><div class='name'>💡 Insight Engine</div>${l.length?l.map(i=>`<div style='margin-top:10px;font-size:13.5px;line-height:1.5'>${esc(i.text)}</div>`).join(''):`<div class='mut' style='margin-top:8px'>Belum ada pola yang jelas. Catat kebiasaanmu beberapa minggu lagi dan insight akan muncul di sini.</div>`}</div>`}
function habitBlock(h){const s=stats(h),t=now(),v=val(h,S.sel);
  const days=[6,5,4,3,2,1,0].map(i=>{const d=addD(t,-i);if(!sched(h,d))return'·';const x=val(h,K(d));return x==='done'?'✓':x==='mini'?'½':x==='off'?'❄':(i===0?'…':'✕')}).join(' ');
  return`🔖 Data habit\n• Kebiasaan: ${h.name} (${REP[h.repeat]}${h.cat?' · '+h.cat:''})\n• Status ${fmtDate(S.sel)}: ${v==='done'?'Selesai':v==='mini'?'Versi mini':v==='off'?'Libur':'Belum'}\n• Streak: ${s.streak} · Completion rate: ${s.cr}%\n• 7 hari terakhir: ${days}`}
function weeklyDraft(){const w=wkStats(0,6),t=now(),from=addD(t,-6);
  const mini=S.habits.reduce((n,h)=>n+Object.entries(h.log).filter(([k,v])=>v==='mini'&&P(k)>=from).length,0);
  const fz=Object.keys(S.freezes).filter(k=>P(k)>=from&&P(k)<=t).length;
  const best=[...w.per].sort((a,b)=>b.p-a.p)[0],low=[...w.per].sort((a,b)=>a.p-b.p)[0];
  const top=[...S.notes].sort((a,b)=>(b.views||0)-(a.views||0))[0],ins=insights()[0],nc=noteCount();
  return`📅 Weekly Review · ${fmtDate(K(from))} – ${fmtDate(K(t))}\n\n`
   +`• Minggu ini kamu menyelesaikan ${w.pct}% habit (${w.dn} dari ${w.tot}).\n`
   +(best?`• Paling konsisten: ${best.h.name} (${best.p}%).\n`:'')
   +(low&&low!==best?`• Perlu perhatian: ${low.h.name} (${low.p}%).\n`:'')
   +(mini?`• ${mini}x memakai versi mini, streak tetap aman ⚡\n`:'')
   +(fz?`• ${fz} hari Life Happens ❄️\n`:'')
   +(top&&top.views?`• Catatan paling sering dibuka: [[${top.title}]]\n`:'')
   +(nc.h?`• Paling sering dicatat: ${nc.h.name} (${nc.n} catatan)\n`:'')
   +(ins?`• ${ins.text}\n`:'')
   +`\n— Refleksi —\n`+(S.reviews[wkKey()]||'Apa yang berjalan baik?\n\nApa yang bisa diperbaiki?\n')}

  return`<div class='sheetbg' data-a='close'><div class='sheet'><div class='bar'></div><div class='name' style='font-size:18px'>💙 Life Happens</div>
  <div class='mut'>${fz?'Hari ini dibekukan. Streak kamu aman.'+(fz.reason?' Alasan: '+esc(fz.reason):''):'Sakit atau ada urusan darurat? Bekukan hari ini tanpa merusak streak.'}</div>
  <div class='nb'>❄️ Sisa freeze bulan ini: ${freezeLeft()}\nKuota tetap 3 kali per bulan kalender</div>
  ${fz?'':`<input type='text' id='lreason' placeholder='Alasan (opsional)' maxlength='60'>`}
  <button class='btn p' data-a='freeze'>${fz?'Batalkan freeze':'Bekukan hari ini'}</button></div></div>`}

function todayV(){const t=now(),sd=P(S.sel),list=S.habits.filter(h=>sched(h,sd)&&(S.cat==='Semua'||h.cat===S.cat));
  const fr=S.freezes[S.sel],act=list.filter(h=>val(h,S.sel)!=='off'),dn=act.filter(h=>isDone(h.log[S.sel])).length,pct=act.length?Math.round(dn/act.length*100):0,R=34,C=2*Math.PI*R;
  const hr=new Date().getHours(),gr=hr<11?'Selamat pagi':hr<15?'Selamat siang':hr<19?'Selamat sore':'Selamat malam';
  return`<div class="mut">${gr}${S.user?', '+esc(S.user.name):''} 👋</div><h1>${S.sel===K(t)?'Hari ini':DAYS[sd.getDay()]}</h1>
  <div class="hero"><div><div class="mut">${sd.getDate()} ${MON[sd.getMonth()]} ${sd.getFullYear()}</div><b>${dn} dari ${act.length} selesai</b><div class="mut">${pct===100&&act.length?'Hebat, semua beres! 🎉':'Terus semangat!'}</div><button class="pill" data-a="life">${fr?'❄️ Hari dibekukan':'💙 Life Happens'} · sisa ${freezeLeft()}</button></div>
   <div style="position:relative;width:86px;height:86px"><svg width="86" height="86" viewBox="0 0 86 86" style="transform:rotate(-90deg)"><circle cx="43" cy="43" r="${R}" fill="none" stroke="#ffffff40" stroke-width="9"/><circle cx="43" cy="43" r="${R}" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" style="transition:stroke-dashoffset .5s"/></svg><div style="position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:18px">${pct}%</div></div></div>
  <div class="week">${[6,5,4,3,2,1,0].map(i=>{const d=addD(t,-i);return`<button class="wd ${K(d)===S.sel?'on':''}" data-a="sel" data-v="${K(d)}">${DAYS[d.getDay()].slice(0,3)}<b>${d.getDate()}</b></button>`}).join('')}</div>
  <div class="chips">${['Semua',...S.cats].map(c=>`<button class="chip ${S.cat===c?'on':''}" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  ${list.length?list.map(h=>{const v=val(h,S.sel),dn1=isDone(v),anc=h.stack&&S.habits.find(x=>x.name.toLowerCase()===h.stack.toLowerCase()),turn=anc&&isDone(anc.log[S.sel])&&!dn1;
   return`<div class="card row" style="${dn1?`background:${h.color}1c;`:''}${v==='off'?'opacity:.6':''}"><div class="ico" style="background:${h.color}26">${h.icon}</div>
   <div class="grow"><div class="name" style="${dn1?'opacity:.6;text-decoration:line-through':''}">${esc(h.name)}</div><div class="mut">${esc(h.cat||'Tanpa kategori')} · ${REP[h.repeat]}${v==='off'?' · Libur':''}${v==='mini'?' · Versi mini':''}</div>${h.stack?`<div class="tag">🔗 Setelah ${esc(h.stack)}${turn?' · 🔔 Giliranmu!':''}</div>`:''}${!dn1&&v!=='off'&&h.mini?`<button class="mb" data-a="mini" data-v="${h.id}">⚡ Hari sibuk? ${esc(h.mini)}</button>`:''}${dn1?`<button class="mb ${h.notes&&h.notes[S.sel]?'nt':''}" data-a="qn" data-v="${h.id}">${h.notes&&h.notes[S.sel]?'📝 '+esc(h.notes[S.sel].slice(0,70)):'📝 Tulis catatan / refleksi'}</button>`:''}</div>
   <button class="chk" data-a="tog" data-v="${h.id}" style="border-color:${h.color};background:${dn1?h.color:'transparent'};${v==='mini'?'opacity:.6':''}">${v==='done'?'✓':v==='mini'?'½':''}</button>
   <button class="dots" data-a="menu" data-v="${h.id}">⋯</button></div>`}).join('')
   :`<div class="empty"><big>🌱</big>Belum ada kebiasaan untuk hari ini.</div>`}
  <button class="add" data-a="new">＋ Create New Habit</button>`}

function sumV(){
  if(!S.habits.length)return`<h1>Ringkasan</h1><div class="empty"><big>📊</big>Belum ada kebiasaan.</div>`;
  const t=now(),b=new Date(t.getFullYear(),t.getMonth()+S.mo,1),n=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();
  return`<div class="hdr"><div><h1>Ringkasan</h1><div class="mut">All habit · ${MON[b.getMonth()]} ${b.getFullYear()}</div></div><div class="row" style="gap:8px"><button class="back" data-a="mo" data-v="-1">‹</button><button class="back" data-a="mo" data-v="1" ${S.mo>=0?'style="opacity:.35"':''}>›</button></div></div>
  ${insCard()}${weekCard()}${S.habits.map(h=>{const s=stats(h);let cells='';
   for(let i=1;i<=n;i++){const d=new Date(b.getFullYear(),b.getMonth(),i),v=h.log[K(d)],fz=!v&&S.freezes[K(d)];let c;
     if(v==='done')c='ok';else if(v==='mini')c='ok mini';else if(fz&&sched(h,d))c='fz';else if(v==='off'||!sched(h,d))c='off';else if(d<t)c='no';else if(K(d)===K(t))c='td';else c='nx';
     cells+=`<div class="d ${c}">${v==='done'?'✓':v==='mini'?'½':c==='fz'?'❄':c==='no'?'✕':i}</div>`}
   return`<div class="card"><div class="row" data-a="ex" data-v="${h.id}" style="cursor:pointer"><div class="ico" style="background:${h.color}26;width:44px;height:44px;font-size:21px;border-radius:15px">${h.icon}</div><div class="grow"><div class="name">${esc(h.name)}</div><div class="mut">${REP[h.repeat]} · ${esc(h.cat||'Tanpa kategori')}</div></div><div class="mut" style="font-size:18px">${S.ex[h.id]?'▾':'▸'}</div></div>
   ${S.ex[h.id]?`<div class="cal">${DAYS.map(x=>`<i>${x[0]}</i>`).join('')}${'<span></span>'.repeat(b.getDay())}${cells}</div>`:''}
   <div class="stats" style="margin-top:${S.ex[h.id]?0:14}px"><div class="st"><b style="color:var(--acc)">${s.streakPct}%</b><span>Current Streak<br>${s.streak} periode</span></div><div class="st"><b style="color:var(--ok)">${s.fin}%</b><span>Habit Finish<br>bulan ini</span></div><div class="st"><b style="color:#f97316">${s.cr}%</b><span>Completion<br>Rate</span></div></div></div>`}).join('')}`}

/* BUG-002: sinkronisasi form dipanggil di awal SETIAP aksi + live saat mengetik */
function syncForm(){const g=i=>$('#'+i);
  if(S.form){const f=S.form;if(g('fname'))f.name=g('fname').value;if(g('fnew'))f.newCat=g('fnew').value;if(g('fmini'))f.mini=g('fmini').value;if(g('fstack'))f.stack=g('fstack').value}
  if(S.nf){if(g('ntitle'))S.nf.title=g('ntitle').value;if(g('nbody'))S.nf.body=g('nbody').value}}
document.addEventListener('input',e=>{if(e.target.id==='wrtext'){S.reviews[e.target.dataset.wk]=e.target.value;save();return}if(!S.form&&!S.nf)return;syncForm();if(e.target.id==='fname'){const p=$('#pvn');if(p)p.textContent=S.form.name||'Nama kebiasaan'}});

/* RISK-002: ekspor dengan fallback aman */
async function doExport(){const ta=$('#bk'),msg=$('#bmsg');
  ta.value=JSON.stringify(dump());ta.focus();ta.select();let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(ta.value);ok=true}}catch(e){}
  if(!ok){try{ta.setSelectionRange(0,ta.value.length);ok=document.execCommand('copy')}catch(e){}}
  msg.textContent=ok?'Data disalin ke clipboard ✓':'Tidak bisa menyalin otomatis. Teks sudah terpilih, salin manual (tekan lama › Salin).'}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=+v,sk=S.sel;
  syncForm();
  const H=i=>S.habits.find(h=>h.id===i);
  if(a==='exp'){doExport();return}
  if(a==='tab'){S.tab=v;S.form=null;S.nf=null;S.cdc=null}
  else if(a==='sel')S.sel=v;
  else if(a==='mini'){const h=H(id);h.log[sk]='mini';stamp(h,sk);S.sheet=null;toast('⚡ Versi mini tercatat, streak aman!');nudge(h)}
  else if(a==='life')S.sheet='life';
  else if(a==='qn'){S.qid=id;S.sheet='qn'}
  else if(a==='ex')S.ex[id]=!S.ex[id];
  else if(a==='catadd'){const n=$('#catnew').value.trim();if(!n){toast('Isi nama kategori');return}
    if(S.cats.some(c=>c.toLowerCase()===n.toLowerCase())){toast('Kategori sudah ada');return}S.cats.push(n);toast('Kategori ditambahkan ✓')}
  else if(a==='catdel'){const n=S.habits.filter(h=>h.cat===v).length;
    if(n&&S.cdc!==v){S.cdc=v;toast('Tap lagi untuk memindahkan '+n+' kebiasaan ke Tanpa kategori')}
    else{S.habits.forEach(h=>{if(h.cat===v)h.cat=''});S.cats=S.cats.filter(c=>c!==v);if(S.cat===v)S.cat='Semua';S.cdc=null;toast('Kategori dihapus')}}
  else if(a==='qnsave'){const h=H(S.qid),tx=$('#qntext').value.trim();h.notes=h.notes||{};if(tx)h.notes[sk]=tx;else delete h.notes[sk];S.sheet=null;toast(tx?'Catatan tersimpan ✓':'Catatan dihapus')}
  else if(a==='freeze'){const r=$('#lreason');if(S.freezes[sk]){delete S.freezes[sk];toast('Freeze dibatalkan')}else if(freezeLeft()<1){toast('Freeze bulan ini sudah habis');return}else{S.freezes[sk]={reason:r?r.value.trim():''};toast('❄️ Streak dibekukan. Istirahat dulu 💙')}S.sheet=null}
  else if(a==='hnote'){const h=H(id);S.nf={title:'Habit Log: '+h.name+' - '+fmtDate(sk),body:habitBlock(h)+'\n\n— Refleksi —\n',hid:h.id};S.sheet=null}
  else if(a==='wr')S.nf={title:'Weekly Review - '+fmtDate(K(now())),body:weeklyDraft()};
  else if(a==='nnew')S.nf={title:'',body:''};
  else if(a==='nopen'){const n=S.notes.find(x=>x.id===id);n.views=(n.views||0)+1;S.nf={...n};S.cd=null}
  else if(a==='ncancel')S.nf=null;
  else if(a==='nsave'){const f=S.nf;if(!f.title.trim()&&!f.body.trim()){toast('Catatan masih kosong');return}
    const n={id:f.id||Date.now(),title:f.title.trim()||'Tanpa judul',body:f.body,date:f.date||K(now()),views:f.views||0,hid:f.hid},i=S.notes.findIndex(x=>x.id===n.id);
    if(i<0)S.notes.unshift(n);else S.notes[i]=n;S.nf=null;S.tab='notes';toast('Catatan tersimpan ✓')}
  else if(a==='ndel'){if(S.cd!==id){S.cd=id;toast('Tap lagi untuk menghapus');return}S.notes=S.notes.filter(x=>x.id!==id);S.nf=null;S.cd=null;toast('Catatan dihapus')}
  else if(a==='fs')S.form.stack=S.form.stack===v?'':v;
  else if(a==='cat')S.cat=v;
  else if(a==='tog'){const h=H(id);if(isDone(h.log[sk])){delete h.log[sk];if(h.times)delete h.times[sk]}else{h.log[sk]='done';stamp(h,sk);nudge(h)}}
  else if(a==='menu'){S.sheet=id;S.cd=null}
  else if(a==='close'){if(e.target!==b)return;S.sheet=null;S.cd=null}
  else if(a==='off'){const h=H(id);if(h.log[sk]==='off')delete h.log[sk];else h.log[sk]='off';S.sheet=null;toast('Diperbarui')}
  else if(a==='edit'){S.form={...H(id),newCat:''};S.sheet=null}
  else if(a==='del'){if(S.cd!==id)S.cd=id;else{S.habits=S.habits.filter(h=>h.id!==id);S.sheet=null;S.cd=null;toast('Kebiasaan dihapus')}}
  else if(a==='new')S.form={name:'',icon:ICONS[0],color:COLORS[0],repeat:'day',cat:S.cats[0]||'',newCat:''};
  else if(a==='cancel')S.form=null;
  else if(a==='fi')S.form.icon=v;
  else if(a==='fc')S.form.color=v;
  else if(a==='fr')S.form.repeat=v;
  else if(a==='fk'){S.form.cat=v;S.form.newCat=''}
  else if(a==='save'){const f=S.form;if(!f.name.trim()){const n=$('#fname');n.style.borderColor='var(--bad)';n.focus();return}
    const cat=f.newCat.trim()||f.cat;if(cat&&!S.cats.includes(cat))S.cats.push(cat);
    const d={name:f.name.trim(),icon:f.icon,color:f.color,repeat:f.repeat,cat,mini:(f.mini||'').trim(),stack:(f.stack||'').trim()};
    if(f.id)Object.assign(H(f.id),d);else S.habits.push({id:Date.now(),...d,start:K(now()),log:{}});
    S.form=null;S.tab='today';toast('Tersimpan ✓')}
  else if(a==='mo')S.mo=Math.min(0,S.mo+ +v);
  else if(a==='login'){const n=$('#lname').value.trim(),m=$('#lmail').value.trim();if(!n||!m){toast('Isi nama & email');return}S.user={name:n,email:m}}
  else if(a==='logout')S.user=null;
  else if(a==='imp'){try{const d=JSON.parse($('#bk').value);if(!Array.isArray(d.habits))throw 0;S.cats=d.cats||[];S.habits=d.habits;S.user=d.user||null;S.notes=d.notes||[];S.freezes=d.freezes||{};S.reviews=d.reviews||{};toast('Berhasil dipulihkan ✓')}catch(x){$('#bmsg').textContent='Data tidak valid.';return}}
  save();render()});
render();
</script>
</body>
</html>
